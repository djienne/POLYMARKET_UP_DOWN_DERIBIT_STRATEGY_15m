api:
  base_url: https://www.deribit.com/api/v2/public/
  max_retries: 3
  timeout: 10
breeden_litzenberger:
  strike_grid_points: 500
  strike_range_std: 3.0
  use_log_strikes: false
filters:
  max_bid_ask_spread_pct: 2.0
  min_days_to_expiry: 0
  min_open_interest: 0
  min_surface_points: 5
  moneyness_range:
  - 0.5
  - 1.5
filters_relaxed:
  max_bid_ask_spread_pct: 0.5
  min_days_to_expiry: 0
  min_open_interest: 1
  min_surface_points: 5
  moneyness_range:
  - 0.5
  - 1.5
heston:
  early_termination_sse: 1.0e-05
  kappa_bounds:
  - 0.01
  - 20.0
  n_integration_points: 128
  n_starts: 6
  optimizer: differential_evolution
  rho_bounds:
  - -0.99
  - 0.99
  theta_bounds:
  - 0.01
  - 8.0
  use_quantlib: true
  v0_bounds:
  - 0.01
  - 4.0
  xi_bounds:
  - 0.1
  - 10.0
intraday:
  annual_drift: 0.0
  standard_horizons:
  - 1
  - 2
  - 4
  - 6
  - 8
  - 12
  - 24
  - 48
  - 72
  use_drift: false
iv_solver:
  max_iterations: 150
  max_iv: 5.0
  min_iv: 0.01
  tolerance: 1.0e-08
model:
  default_model: ssvi
  iv_consistency_relaxation: 0.15
  iv_consistency_threshold: 0.1
  iv_consistency_ttm_cutoff: 0.05
  min_calibration_ttm_days: 1.0
  trading_model: ssvi_surface
monte_carlo:
  confidence_level: 0.95
  n_simulations: 1000000
  n_steps_per_day: 28800
  use_antithetic: true
output:
  dpi: 150
  plot_format: png
  save_json: true
  save_plots: true
ssvi:
  global_optimizer: differential_evolution
  n_starts: 5
  optimizer: L-BFGS-B
  phi_bounds:
  - 0.001
  - 5.0
  regularization_lambda: 0.001
  rho_bounds:
  - -0.99
  - 0.99
  short_dated_phi_bounds:
  - 0.001
  - 20.0
  short_dated_ttm_threshold: 0.1
  theta_bounds:
  - 0.001
  - 10.0
  use_global_optimizer: true
  use_multi_start: true
  use_relative_error: true
ssvi_surface:
  enabled: true
  eta_bounds:
  - 0.01
  - 10.0
  fallback_to_independent: true
  lam_bounds:
  - 0.0
  - 0.5
  max_ttm_days: 4.0
  maxiter: 300
  min_expiries: 2
  rho_bounds:
  - -0.99
  - 0.99
  use_relative_error: true
  workers: 4
validation:
  integral_tolerance: 0.05
  iv_normal_range:
  - 0.1
  - 3.0
  iv_typical_range:
  - 0.2
  - 2.0
  iv_valid_range:
  - 0.05
  - 5.0
  mean_forward_tolerance: 0.1
  r_squared_acceptable: 0.8
  r_squared_excellent: 0.9
  r_squared_poor: 0.5
  spot_price_max: 1000000
  spot_price_min: 10000
